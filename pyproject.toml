[project]
name = "emporio-agent"
version = "0.1.0"
description = "Agente de atendimento virtual da Emporio da Musica (desafio Artefact AI Engineer)"
requires-python = ">=3.11,<4.0"
dependencies = [
    "deepagents==0.7.32",
    "langgraph==1.2.18",
    "langgraph-checkpoint-sqlite==3.1.2",
    "langchain-openai==1.7.3",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.2",
    "gradio==6.31.0",
    "chromadb==1.5.9",
    "pypdf==6.21.4",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "eval: testes que requerem OPENAI_API_KEY e chamam o LLM real",
]

[tool.ruff]
line-length = 100
