services:
  emporio:
    build: .
    ports:
      # So o proprio computador acessa: a tela de chave nao tem autenticacao e o chat gasta a chave paga
      - "127.0.0.1:7860:7860"
    env_file:
      - path: .env
        required: false
    volumes:
      - emporio-data:/app/data/runtime

volumes:
  emporio-data:
